<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Специалист · EnergyTool</title><link rel="stylesheet" href="/assets/css/applications.css"><link rel="stylesheet" href="/assets/css/specialist.css"><script defer src="/assets/js/specialist.js"></script></head>
<body><header class="workspace-header"><a class="brand" href="/"><strong>МТС</strong> EnergyTool</a><span>Рабочее место специалиста</span><a href="/applications.html">Заявки</a><a href="/consultation.html">Консультация</a></header>
<main class="workspace"><div class="page-heading"><h1>Вопросы специалисту</h1><button id="refresh">Обновить</button></div>
<details class="metrics" open id="access"><summary>Доступ оператора</summary><form id="login" class="operator-login"><label>Идентификатор<input name="actor" required autocomplete="username" placeholder="Имя оператора"></label><label>Роль<select name="role"><option value="coordinator">Координатор</option><option value="specialist">Специалист</option><option value="reviewer">Редактор базы</option></select></label><label>Ключ оператора<input name="token" type="password" required autocomplete="off"></label><button class="primary">Подключиться</button></form><p class="muted">Ключ задаётся при запуске стенда. Это доступ для демонстрации; промышленная авторизация подключается отдельно.</p></details>
<p id="feedback" class="feedback" role="status">Введите данные доступа.</p>
<nav class="actions" aria-label="Раздел"><button id="requests-tab" aria-pressed="true">Вопросы</button><button id="knowledge-tab" aria-pressed="false">База знаний</button><button id="new-draft">Создать запись</button></nav>
<div class="work-area"><section class="queue"><h2 id="list-title">Очередь вопросов</h2><div id="list"></div></section><section class="application" id="detail" aria-live="polite"><p class="muted">Выберите вопрос или запись.</p></section></div>
</main></body></html>
